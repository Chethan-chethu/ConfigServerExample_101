spring:
  cloud:
    gateway:
      routes:
        - id: service-A
          uri: lb://service-a
          predicates:
            - Path=/serviceA/**

        - id: service-B
          uri: lb://service-b
          predicates:
            - Path=/serviceB/**
        - id: service-C
          uri: lb://service-c
          predicates:
            - Path=/serviceC/**     