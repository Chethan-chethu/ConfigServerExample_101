spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: service-a
              uri: lb://service-a
              predicates:
                - Path=/serviceA/**
              filters:
                - name: RequestRateLimiter
                  args: 
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                - StripPrefix=1                
            - id: service-b
              uri: lb://service-b
              predicates:
                - Path=/serviceB/**
              filters:
                - StripPrefix=1
            - id: service-c
              uri: lb://service-c
              predicates:
                - Path=/serviceC/**
              filters:
                - StripPrefix=1